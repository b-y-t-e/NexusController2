[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-controller-server"
version = "2.0.3"
description = "Turn an Android phone into a virtual Xbox 360 / DualShock 4 / Buzz controller for Windows"
requires-python = ">=3.10"
dependencies = [
    "vgamepad>=0.1.0",
    "pywebview>=5.0",
    "qrcode[pil]>=7.4",
    "pynput>=1.7",
    # The notification-area icon. Optional at runtime — the app starts and runs
    # without it, and then closing the window quits as it always did.
    "pystray>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.2"]

[project.scripts]
nexus-controller = "nexus_server.app:main"

[tool.setuptools]
package-dir = { "" = "server" }

[tool.setuptools.packages.find]
where = ["server"]

[tool.setuptools.package-data]
nexus_server = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server", "."]   # "." so tests can import build_release.py
addopts = "-q --timeout=30"
filterwarnings = ["error::DeprecationWarning:nexus_server.*"]
