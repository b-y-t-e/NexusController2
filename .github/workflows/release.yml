name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    name: Windows executable
    runs-on: windows-latest
    # Nothing here takes ten minutes. The first tagged build sat in "Install
    # dependencies" for the best part of an hour (see the step below) with no
    # way to tell a hang from slow work, so this is the difference between a
    # failed run and a run that never ends.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # vgamepad ships as an sdist only, and its setup.py runs `msiexec /i` on
      # the ViGEmBus MSI it carries — *interactively*, whenever the driver is not
      # already in the registry. On a runner that dialog has nobody to answer it,
      # so pip waits for ever: the first tagged build sat here for 52 minutes.
      # The driver therefore goes in silently before pip runs, and vgamepad's own
      # detection then finds it and installs nothing.
      #
      # The sdist is fetched straight from PyPI rather than with `pip download`,
      # which was the first attempt and hung in exactly the same way: pip builds
      # the metadata through setuptools' `dist_info`, and setup.py only skips its
      # msiexec call for `egg_info` and `sdist`. Nothing here executes any of the
      # package's code.
      - name: Install ViGEmBus, so vgamepad's own installer stays quiet
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          $work = Join-Path $env:RUNNER_TEMP "vgamepad"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $meta = Invoke-RestMethod "https://pypi.org/pypi/vgamepad/json"
          $sdist = $meta.urls | Where-Object { $_.packagetype -eq "sdist" } | Select-Object -First 1
          if (-not $sdist) { throw "vgamepad has no sdist on PyPI" }
          $archive = Join-Path $work $sdist.filename
          Invoke-WebRequest $sdist.url -OutFile $archive
          tar -xzf $archive -C $work
          $msi = Get-ChildItem $work -Recurse -Filter ViGEmBusSetup_x64.msi | Select-Object -First 1
          if (-not $msi) { throw "no ViGEmBus MSI in the vgamepad sdist" }
          $run = Start-Process msiexec -Wait -PassThru `
            -ArgumentList "/i", "`"$($msi.FullName)`"", "/qn", "/norestart"
          if ($run.ExitCode -ne 0) { throw "ViGEmBus install failed with $($run.ExitCode)" }
          # Checked the way setup.py checks, because that is the only opinion
          # that decides whether pip stops to ask a question nobody can answer.
          $found = reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" /s |
            Select-String -Quiet "Nefarius Virtual Gamepad Emulation Bus Driver"
          if (-not $found) { throw "ViGEmBus is not in the registry — pip would hang on its installer" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pyinstaller

      - name: Run the test suite
        run: python -m pytest

      - name: Build the executable
        run: python tools/build_exe.py

      # Again, here, on the artefact that is about to be uploaded. build_exe.py
      # runs this too, but the thing being released is this file — and until a
      # user's crash dialog said otherwise, nothing had ever started it.
      #
      # Through build_release.py rather than by running the exe from the shell,
      # for one reason and one lesson. The reason is the rule this repository
      # already applies to signature checking: one implementation, called from
      # both places, instead of a second copy in YAML. The lesson is that the
      # copy in YAML was already wrong — the app is built --windowed, so a
      # console does not wait for it, and $LASTEXITCODE was read before the
      # process had even started. The step failed while the executable it was
      # testing printed "selftest ok" two seconds later.
      - name: Check that it starts
        run: >
          python -c "import pathlib, build_release;
          build_release.verify_it_starts(pathlib.Path('dist/NexusController.exe'))"

      - uses: actions/upload-artifact@v4
        with:
          name: NexusController-windows
          path: |
            dist/NexusController.exe
            dist/SHA256SUMS.txt

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The mode bit is set in git (100755), so this changes nothing on a healthy
      # checkout — it is here because the first tagged build died on
      # "./gradlew: Permission denied" after the file was committed from Windows,
      # and a whole release failing on a file mode is not worth the two seconds
      # this saves.
      - name: Make the wrapper executable
        run: chmod +x android/gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testModernDebugUnitTest

      # Both flavours, because they are the same code against very different
      # minimum API levels and only lint can tell them apart: an API 26 call is
      # invisible to the compiler, to the unit tests and to a phone running 13 —
      # and a NoClassDefFoundError on an older one, which no catch block sees.
      - name: Lint
        working-directory: android
        run: ./gradlew --no-daemon lintModernDebug lintLegacyDebug

      # The key, from repository secrets. Without it Gradle silently produces
      # app-*-release-unsigned.apk and the staging step below fails to find the
      # file it expects — which is the intended outcome: an unsigned APK is one
      # no phone installs, and a release must not contain one.
      - name: Restore the signing key
        env:
          NEXUS_KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NEXUS_KEYSTORE_BASE64" ]; then
            echo "::error::NEXUS_KEYSTORE_BASE64 is not set — the APKs would be unsigned"
            exit 1
          fi
          printf '%s' "$NEXUS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nexus-release.jks"

      - name: Build the APKs
        working-directory: android
        env:
          NEXUS_KEYSTORE: ${{ runner.temp }}/nexus-release.jks
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleModernRelease assembleLegacyRelease

      # Staged flat, and named here rather than in the publish job. With two
      # explicit paths, upload-artifact roots the artifact at their least common
      # ancestor — apk/ — so the files arrive as modern/debug/app-modern-debug.apk
      # and the publish job's cp missed them, failing every tagged build.
      - name: Stage the APKs
        run: |
          mkdir -p staging
          cp android/app/build/outputs/apk/modern/release/app-modern-release.apk \
             staging/NexusController.apk
          cp android/app/build/outputs/apk/legacy/release/app-legacy-release.apk \
             staging/NexusController-legacy.apk

      # Belt and braces. The copy above already fails on an unsigned build, but a
      # release signed by the *wrong* key looks exactly like a correct one until
      # somebody's phone refuses the update — by which point the tag is public.
      - name: Verify the signatures
        # The same function the local build uses, rather than a second
        # implementation in shell. One pin was already the rule here; one *parser*
        # matters just as much, because the two rules had already drifted — the
        # shell anchored on "Signer #1", the Python matched any line containing a
        # digest, and apksigner prints several. It also failed open in the one way
        # that counts: with `sed` in a pipeline the exit status is sed's, so an
        # apksigner that errored produced an empty digest, and had the expected
        # value ever been empty too the comparison would have passed.
        run: |
          python3 - <<'PY'
          import pathlib, sys
          import build_release

          def fail(message):
              # Workflow commands are only read on stdout — sys.exit(str) writes
              # to stderr, where "::error::" is just text in the log and no
              # annotation appears on the run. The step still fails either way;
              # this is about the failure being visible without opening it.
              #
              # And a command ends at the newline, so a multi-line message would
              # annotate its first line and print the rest as bare log text —
              # which is the half that names the certificate that did not match.
              text = str(message).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error::{text}", flush=True)
              sys.exit(1)

          apks = sorted(pathlib.Path("staging").glob("*.apk"))
          if len(apks) != 2:
              fail(f"expected two staged APKs, found {[p.name for p in apks]}")
          try:
              build_release.verify_signatures([(p, p.name) for p in apks])
          except build_release.StepFailed as exc:
              fail(exc)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: NexusController-apk
          path: staging/

  publish:
    name: Collect and publish
    needs: [server, android]
    runs-on: ubuntu-latest
    # Runs on a manual dispatch as well, and only the last step is tag-only. The
    # collecting is what broke the last time — the artifact layout did not match
    # the paths this job copies — and gating the whole job on a tag meant the
    # only way to find that out was to push one and watch it fail. Now a
    # workflow_dispatch run proves the release would assemble, and creates
    # nothing.
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir -p release
          cp artifacts/NexusController-windows/NexusController.exe release/
          cp artifacts/NexusController-apk/NexusController.apk release/
          cp artifacts/NexusController-apk/NexusController-legacy.apk release/
          # Written last and never fed to itself: `sha256sum *` with the output
          # file already in the directory truncates it first and then hashes the
          # empty result, so the release shipped a checksum of nothing under its
          # own name. The Windows job's partial list is not copied over for the
          # same reason — this one covers every file that is actually released.
          (cd release && sha256sum NexusController* > SHA256SUMS.txt)
          ls -la release

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release/*
          generate_release_notes: true
          body: |
            **PC:** download `NexusController.exe` and run it. No Python needed.
            If ViGEmBus is missing the app offers to install it — reboot afterwards.

            **Phone:** install `NexusController.apk` (Android 9+), then scan the QR
            code shown by the dashboard. On an older phone use
            `NexusController-legacy.apk`, which installs back to Android 5.

            > **Updating from 2.0.0 or earlier: uninstall the app first.**
            > Those builds were signed with a throwaway key that changed on every
            > build, so Android refuses to install this one over them
            > (`INSTALL_FAILED_UPDATE_INCOMPATIBLE`). Uninstalling loses the
            > layouts saved on the phone. This is the last time: from this release
            > on the key is stable, and updates install straight over the top.

            Verify your download against `SHA256SUMS.txt`.
