name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pyinstaller

      - name: Run the test suite
        run: python -m pytest

      - name: Build the executable
        run: python tools/build_exe.py

      - uses: actions/upload-artifact@v4
        with:
          name: NexusController-windows
          path: |
            dist/NexusController.exe
            dist/SHA256SUMS.txt

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NexusController-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  publish:
    name: Publish release
    needs: [server, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir -p release
          cp artifacts/NexusController-windows/NexusController.exe release/
          cp artifacts/NexusController-windows/SHA256SUMS.txt release/ || true
          cp artifacts/NexusController-apk/app-debug.apk release/NexusController.apk
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            **PC:** download `NexusController.exe` and run it. No Python needed.
            If ViGEmBus is missing the app offers to install it — reboot afterwards.

            **Phone:** install `NexusController.apk` (Android 9+), then scan the QR
            code shown by the dashboard.

            Verify your download against `SHA256SUMS.txt`.
