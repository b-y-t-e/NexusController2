name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pyinstaller

      - name: Run the test suite
        run: python -m pytest

      - name: Build the executable
        run: python tools/build_exe.py

      - uses: actions/upload-artifact@v4
        with:
          name: NexusController-windows
          path: |
            dist/NexusController.exe
            dist/SHA256SUMS.txt

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testModernDebugUnitTest

      # Both flavours, because they are the same code against very different
      # minimum API levels and only lint can tell them apart: an API 26 call is
      # invisible to the compiler, to the unit tests and to a phone running 13 —
      # and a NoClassDefFoundError on an older one, which no catch block sees.
      - name: Lint
        working-directory: android
        run: ./gradlew --no-daemon lintModernDebug lintLegacyDebug

      # The key, from repository secrets. Without it Gradle silently produces
      # app-*-release-unsigned.apk and the staging step below fails to find the
      # file it expects — which is the intended outcome: an unsigned APK is one
      # no phone installs, and a release must not contain one.
      - name: Restore the signing key
        env:
          NEXUS_KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NEXUS_KEYSTORE_BASE64" ]; then
            echo "::error::NEXUS_KEYSTORE_BASE64 is not set — the APKs would be unsigned"
            exit 1
          fi
          printf '%s' "$NEXUS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nexus-release.jks"

      - name: Build the APKs
        working-directory: android
        env:
          NEXUS_KEYSTORE: ${{ runner.temp }}/nexus-release.jks
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleModernRelease assembleLegacyRelease

      # Staged flat, and named here rather than in the publish job. With two
      # explicit paths, upload-artifact roots the artifact at their least common
      # ancestor — apk/ — so the files arrive as modern/debug/app-modern-debug.apk
      # and the publish job's cp missed them, failing every tagged build.
      - name: Stage the APKs
        run: |
          mkdir -p staging
          cp android/app/build/outputs/apk/modern/release/app-modern-release.apk \
             staging/NexusController.apk
          cp android/app/build/outputs/apk/legacy/release/app-legacy-release.apk \
             staging/NexusController-legacy.apk

      # Belt and braces. The copy above already fails on an unsigned build, but a
      # release signed by the *wrong* key looks exactly like a correct one until
      # somebody's phone refuses the update — by which point the tag is public.
      - name: Verify the signatures
        run: |
          # The pin lives in build_release.py, which checks it locally too. Two
          # copies of a fingerprint are one copy more than can be kept in step,
          # and the one that drifts is the one nobody reads.
          EXPECTED=$(python3 -c "import build_release; print(build_release.RELEASE_CERT_SHA256)")
          # sort -V, not sort: in plain text order "9.0.0" beats "35.0.0", so the
          # oldest build-tools on the machine would be the one doing the checking.
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in staging/*.apk; do
            digest=$("$apksigner" verify --print-certs "$apk" \
                     | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            echo "$apk: $digest"
            if [ "$digest" != "$EXPECTED" ]; then
              echo "::error::$apk is signed by the wrong key"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: NexusController-apk
          path: staging/

  publish:
    name: Collect and publish
    needs: [server, android]
    runs-on: ubuntu-latest
    # Runs on a manual dispatch as well, and only the last step is tag-only. The
    # collecting is what broke the last time — the artifact layout did not match
    # the paths this job copies — and gating the whole job on a tag meant the
    # only way to find that out was to push one and watch it fail. Now a
    # workflow_dispatch run proves the release would assemble, and creates
    # nothing.
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir -p release
          cp artifacts/NexusController-windows/NexusController.exe release/
          cp artifacts/NexusController-apk/NexusController.apk release/
          cp artifacts/NexusController-apk/NexusController-legacy.apk release/
          # Written last and never fed to itself: `sha256sum *` with the output
          # file already in the directory truncates it first and then hashes the
          # empty result, so the release shipped a checksum of nothing under its
          # own name. The Windows job's partial list is not copied over for the
          # same reason — this one covers every file that is actually released.
          (cd release && sha256sum NexusController* > SHA256SUMS.txt)
          ls -la release

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release/*
          generate_release_notes: true
          body: |
            **PC:** download `NexusController.exe` and run it. No Python needed.
            If ViGEmBus is missing the app offers to install it — reboot afterwards.

            **Phone:** install `NexusController.apk` (Android 9+), then scan the QR
            code shown by the dashboard. On an older phone use
            `NexusController-legacy.apk`, which installs back to Android 5.

            > **Updating from 2.0.0 or earlier: uninstall the app first.**
            > Those builds were signed with a throwaway key that changed on every
            > build, so Android refuses to install this one over them
            > (`INSTALL_FAILED_UPDATE_INCOMPATIBLE`). Uninstalling loses the
            > layouts saved on the phone. This is the last time: from this release
            > on the key is stable, and updates install straight over the top.

            Verify your download against `SHA256SUMS.txt`.
